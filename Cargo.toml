[workspace]
members = ["crates/*"]
default-members = ["crates/fpa-proxy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
fpa-ws-client = { git = "https://github.com/Zizico2/fpa-openapi.git", rev = "84bf6a7df7716c1e24ef65eb18d3e09a060195c3" }
fpa-portal-client = { git = "https://github.com/Zizico2/fpa-openapi.git", rev = "84bf6a7df7716c1e24ef65eb18d3e09a060195c3" }
fpa-proto = { git = "https://github.com/Zizico2/fpa-proto.git", rev = "d4d42cfc97d2eb48936f3ce2f87eed953c857780" }
fpa-service = { path = "crates/fpa-service", version = "0.1.0" }

anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
flate2 = "1"
prost = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "http2"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-reflection = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
